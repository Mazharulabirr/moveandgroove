name: App Health

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

concurrency:
  group: app-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  healthcheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Architecture checks
        run: npm run archcheck

      - name: Production build
        run: npm run build
